<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}"
  lang="ja"
>
  <head>
    <title layout:fragment="title">Post detail</title>
  </head>

  <main layout:fragment="content">
    <h1 th:text="${post.title}">Post detail</h1>
    <p th:text="${post.content}">Content</p>
    <a th:href="@{/posts}" class="btn btn-secondary">Back to list</a>
    <a th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn btn-primary"
      >Edit</a
    >
    <form
      th:action="@{/posts/{id}/delete(id=${post.id})}"
      method="post"
      style="display: inline"
    >
      <button type="submit" class="btn btn-danger">Delete</button>
    </form>
  </main>
</html>
